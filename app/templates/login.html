<!doctype html><html lang="ru"><head><meta charset="utf-8"><title>Вход — ЦИТР.CRM</title>
<link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}"></head>
<body class="auth">
<form class="authbox" method="post" autocomplete="off">
  <span class="logo">Ц</span>
  <h1>Вход в ЦИТР.CRM</h1>
  <p>Учёт клиентов, сделок и коммуникаций ООО «ЦИТР»</p>
  {% with msgs = get_flashed_messages(with_categories=true) %}{% for c,m in msgs %}<div class="flash {{c}}">{{m}}</div>{% endfor %}{% endwith %}
  <div class="row"><label>Логин</label><input name="login" value="{{ request.form.login }}" required></div>
  <div class="row"><label>Пароль</label><input name="password" type="password" required></div>
  <button class="btn" style="width:100%;margin-top:6px">Войти</button>
  <p class="muted" style="margin:14px 0 0;font-size:11.5px">Пароль проверяется по хэшу SHA-256 с солью. Учётные записи создаёт администратор.</p>
</form>
</body></html>
